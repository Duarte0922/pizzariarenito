<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Cardápio - Tele Pizza Burguer Renito</title>
<style>
:root{--red:#d62a0e;--ink:#1c1917;--mute:#78716c;--line:#e7e5e4;--bg:#f3f2f1;--ok:#15803d}
*{box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);margin:0;padding-bottom:60px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{color:var(--red);font-size:20px;margin:8px 0 4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit}
textarea{resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1}
.btn{background:var(--red);color:#fff;border:0;border-radius:8px;font:inherit;font-weight:700;padding:10px 14px;cursor:pointer}
.btn.sec{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.ok{background:var(--ok)}
.btn.small{padding:6px 10px;font-size:12px;font-weight:600}
.btn.danger{background:#fff;color:#b91c1c;border:1px solid #b91c1c}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{flex:none;padding:8px 12px;border-radius:20px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--red);color:#fff;border-color:var(--red)}
.prod{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px}
.prod img{width:44px;height:44px;object-fit:cover;border-radius:6px;flex:none}
.prod .ph{width:44px;height:44px;border-radius:6px;background:var(--bg);display:grid;place-items:center;flex:none;font-size:20px}
.prod .info{flex:1;min-width:0}
.prod b{display:block;font-size:14px}
.prod small{color:var(--mute);font-size:12px}
.prod .acts{display:flex;gap:6px;flex:none}
.opt-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
.opt-row input{flex:1}
.opt-row button{flex:none}
.topbar{position:sticky;top:0;background:var(--bg);padding-top:10px;z-index:5}
.topbar .btn{width:100%;margin-bottom:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal.on{display:flex}
.modal .panel{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
.msg{font-size:12px;color:var(--ok);margin-left:8px}
.empty{color:var(--mute);font-size:13px;padding:20px;text-align:center}
.imgprev{width:70px;height:70px;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Painel do cardápio</h1>
  <div class="sub">Tele Pizza Burguer Renito — edite aqui e depois baixe o cardápio atualizado para enviar ao cliente</div>

  <div class="card">
    <label>WhatsApp para pedidos (com DDI 55 + DDD, só números)</label>
    <input id="phone" placeholder="5531986126555">
  </div>

  <div class="topbar">
    <button class="btn ok" id="btnBaixar">⬇ Baixar cardápio atualizado (index.html)</button>
    <div class="row">
      <button class="btn sec small" id="btnExport">Exportar backup</button>
      <button class="btn sec small" id="btnImportShow">Importar backup</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
    </div>
  </div>

  <div class="card">
    <div class="row" style="align-items:flex-end">
      <div>
        <label>Categorias</label>
      </div>
      <button class="btn small" id="btnNovaCat" style="flex:none">+ Categoria</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <button class="btn" id="btnNovoProd" style="width:100%">+ Adicionar produto nesta categoria</button>
  </div>

  <div id="lista"></div>
</div>

<div class="modal" id="modal"><div class="panel" id="modalBody"></div></div>

function selCat(cat) { catAtual = cat; renderTabs(); renderLista(); }

function renderLista() {
  const g = state.menu.find(x => x.cat === catAtual);
  if (!g) { $("lista").innerHTML = `<div class="empty">Escolha ou crie uma categoria.</div>`; return; }
  if (!g.items.length) { $("lista").innerHTML = `<div class="empty">Nenhum produto nesta categoria ainda.</div>`; return; }

    const precoMin = Math.min(...it.o.map(o => o[1]));

      ? `<img class="ph" src="${it.img}" alt="" onerror="this.style.display='none'">`

    return `<div class="prod">

function novaCategoria() {
  const nome = prompt("Nome da nova categoria:");
  if (!nome || !nome.trim()) return;
  if (state.menu.some(g => g.cat === nome.trim())) { alert("Já existe uma categoria com esse nome."); return; }
  state.menu.push({ cat: nome.trim(), items: [] });
  catAtual = nome.trim();
  saveState(); renderTabs(); renderLista();
}

  const g = state.menu.find(x => x.cat === catAtual);
  if (!confirm(`Excluir "${g.items[i].n}"?`)) return;
  g.items.splice(i, 1);
  saveState(); renderLista();
}
